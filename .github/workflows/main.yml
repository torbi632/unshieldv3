name: Build unshieldv3 on Windows

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 关键步骤：设置 MSVC 开发环境（x64）
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 现在 CMake 能正确检测到 Visual Studio
      - name: Configure CMake
        run: |
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: |
          cd build
          cmake --build . --config Release --parallel

      # 验证是否为 Windows PE（可选）
      - name: Verify EXE
        run: |
          $bytes = [System.IO.File]::ReadAllBytes(".\build\Release\unshieldv3.exe")
          if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            Write-Host "✅ Valid Windows executable (MZ header found)"
          } else {
            Write-Error "❌ Not a valid PE file"
            exit 1
          }

      - name: Upload unshieldv3.exe
        uses: actions/upload-artifact@v4
        with:
          name: unshieldv3.exe
          path: build/Release/unshieldv3.exe
