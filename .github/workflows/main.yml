name: Build unshieldv3 for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # 如果你的源码需要单独克隆，可取消下面注释
      # - name: Clone unshieldv3
      #   run: git clone https://github.com/wolfgangf/unshieldv3.git

      - name: Configure CMake (Visual Studio)
        run: |
          cd unshieldv3
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: |
          cd unshieldv3/build
          cmake --build . --config Release

      # 编译产物路径：unshieldv3/build/Release/unshieldv3.exe
      - name: List archive and extract (示例)
        run: |
          .\unshieldv3\build\Release\unshieldv3.exe list -v .\path\to\your\archive.Z
          mkdir extracted
          .\unshieldv3\build\Release\unshieldv3.exe extract .\path\to\your\archive.Z .\extracted\

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unshieldv3-windows-exe
          path: unshieldv3/build/Release/unshieldv3.exe

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files
          path: extracted/
