name: Build unshieldv3 on Windows (MSVC)

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 MSVC 开发环境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- 修补 ISArchiveV3.h（位于根目录） ----
      - name: Patch ISArchiveV3.h for MSVC
        run: |
          $file = "ISArchiveV3.h"
          if (-not (Test-Path $file)) {
            Write-Error "File $file not found in root directory"
            exit 1
          }
          $content = Get-Content $file -Raw
          $content = $content -replace '__attribute__\s*\(\s*\(\s*packed\s*\)\s*\)', ''
          $content = "#pragma pack(push, 1)`n" + $content + "`n#pragma pack(pop)"
          Set-Content -Path $file -Value $content -NoNewline
          Write-Host "✅ Patched $file for MSVC"
        shell: pwsh

      # ---- 配置 CMake（源码就在当前目录） ----
      - name: Configure with NMake
        run: |
          cd build
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

      # ---- 编译 ----
      - name: Build
        run: |
          cd build
          nmake

      # ---- 验证 EXE ----
      - name: Verify EXE
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/unshieldv3.exe")
          if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            Write-Host "✅ Valid Windows executable (MZ header found)"
          } else {
            Write-Error "❌ Not a valid PE file"
            exit 1
          }

      # ---- 上传 EXE ----
      - name: Upload unshieldv3.exe
        uses: actions/upload-artifact@v4
        with:
          name: unshieldv3.exe
          path: build/unshieldv3.exe

      # （可选）提取您的 .Z 存档
