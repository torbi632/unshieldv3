name: Cross-compile unshieldv3 for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mingw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # 如果源码需要单独克隆，可取消注释
      # - name: Clone unshieldv3
      #   run: git clone https://github.com/wolfgangf/unshieldv3.git

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 cmake make

      - name: Configure CMake for Windows cross-compile
        run: |
          cd unshieldv3
          mkdir build && cd build
          cmake .. -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
                   -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
                   -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres

      - name: Build
        run: |
          cd unshieldv3/build
          make -j$(nproc)

      # 生成的 EXE 位于 unshieldv3/build/unshieldv3.exe
      - name: Test extraction (using Wine 或直接运行，但非必须)
        run: |
          # 由于是 Linux 环境，无法直接运行 .exe，但可以上传供下载
          echo "Build completed. EXE is ready."

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: unshieldv3-windows-cross-compiled
          path: unshieldv3/build/unshieldv3.exe
